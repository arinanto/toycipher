[project]
name = "toycipher"
version = "0.1.0-rc.3"
description = "Streaming file encryption with a three-cipher SM4/Camellia/AES-CBC cascade and a KMAC256 authentication tag"
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pwinput>=1.0.3",
    "pycryptodome>=4.5.0",
]

[project.scripts]
toycipher = "toycipher:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
# Releases are cut by .github/workflows/release.yml, not by hand.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
signoff_commit = true  # every commit in this repo needs a DCO trailer
# Stay on 0.x until 1.0.0 is a deliberate decision. v10 defaults to
# allow_zero_version = false, which forces the first release to 1.0.0-rc.1.
allow_zero_version = true
major_on_zero = false  # a breaking change on 0.x bumps the minor digit, not to 1.0.0

[tool.semantic_release.branches.main]
match = "main"
# The workflow passes --as-prerelease on every push, so the automatic path is
# always an rc. A GA release is a manual dispatch that omits the flag, which
# finalises the latest rc instead of starting a new one. --as-prerelease is a
# one-way switch, hence `false` here rather than `true`.
prerelease = false
prerelease_token = "rc"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
search-path = ["src"]
preset = "strict"
check-unannotated-defs = true

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
