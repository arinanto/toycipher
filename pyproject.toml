[project]
name = "toycipher"
version = "0.1.0"
description = "Streaming file encryption with a three-cipher SM4/Camellia/AES-CBC cascade and a KMAC256 authentication tag"
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pwinput>=1.0.3",
    "pycryptodome>=4.5.0",
]

[project.scripts]
toycipher = "toycipher:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
search-path = ["src"]
preset = "strict"
check-unannotated-defs = true

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
